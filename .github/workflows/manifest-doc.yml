name: Update source manifest (docs)

# ─────────────────────────────────────────────────────────────────
# Doc shape (docs / notes / study repos). There's no app build and no web
# bundle — this workflow exists only to publish the SOURCE MANIFEST that the
# dashboard's Structure tab fetches, so a docs repo gets a Code lens (file tree
# + Explain + View on GitHub). It's the thinnest lens-publishing shape: the
# generator runs in doc mode — a recursive .md/.markdown/.mdx walk that emits
# just the file list (no heading outline) — so the Code lens nests the docs by
# folder and the second slot reads "no UI surface".
#
# It regenerates src-manifest.json at the repo ROOT (where Pages serves it,
# "Deploy from a branch -> main -> root") and commits it back to main, but ONLY
# when the .md file LIST changed: deterministic mode (no volatile timestamp/sha)
# means an unchanged set of docs produces a byte-identical manifest and no
# commit.
#
# Node-only: the scanner is pure Node with no dependencies. A docs repo has no
# other build/test workflow.
#
# MANIFEST_SRC_ROOT scopes the walk to this project's folder. The onboard script
# fills it, and it equals this repo's srcPrefix in the worker's ALLOWED_TARGETS.
# Leave it blank for a repo whose docs sit at the root.
#
# Loop prevention: paths-ignore skips src-manifest.json (so the manifest commit
# doesn't re-trigger this workflow) and the commit carries [skip ci].
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths-ignore:
      - 'TODO.md'
      - 'src-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate doc source manifest (repo root, deterministic)
        run: node scripts/gen-src-manifest.js
        env:
          MANIFEST_LANG: 'doc'
          MANIFEST_SRC_ROOT: '{{MANIFEST_SRC_ROOT}}'
          MANIFEST_OUT_DIR: '.'
          MANIFEST_DETERMINISTIC: 'true'

      - name: Commit manifest if the file list changed
        run: |
          if [[ -n "$(git status --porcelain src-manifest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src-manifest.json
            git commit -m "Update source manifest [skip ci]"
            git push
          else
            echo "Manifest unchanged — nothing to commit."
          fi
