name: Claude triage

# correlation_id is echoed into run-name so the app/Worker can find this run by
# name (workflow_dispatch returns no run id — same trick as claude-run.yml).
# project_id scopes the sweep to one project's flagged tasks: the agent is
# per-project for now.
run-name: Claude triage ${{ inputs.correlation_id }} · ${{ inputs.project_id }} · ${{ inputs.model || 'default' }}

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: project id whose triaging tasks to sweep
        type: string
        required: true
      correlation_id:
        description: opaque id echoed into run-name for status polling
        type: string
        required: false
      model:
        description: resolved model id (empty = workflow default); kimi-*/deepseek-* reroute via the Worker gateway
        type: string
        required: false
  # Optional self-sweep — uncomment to have the agent wake on a schedule and
  # process any triaging rows with no explicit dispatch. Min interval 5 min;
  # GitHub delays/skips scheduled runs under load and disables them after 60
  # days of repo inactivity, so treat this as a backstop, not the primary path.
  # NOTE: on a schedule there is no project_id input — the routine would need to
  # sweep all triaging rows instead. Left off until the per-project dispatch
  # path is wired.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: read      # triage only READS source — it never opens PRs or writes the repo
  id-token: write     # required: the action authenticates via OIDC

concurrency:
  # one triage sweep at a time; a second dispatch queues rather than overlapping
  group: claude-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # shallow is enough — triage reads current source, no git history needed
        with:
          fetch-depth: 1

      # Resolve model routing. A kimi-*/deepseek-* pick reroutes EVERY Claude
      # Code call this job makes through the Worker's /anthropic gateway
      # (API-billed at that provider; the subscription is untouched). Vars set
      # here reach the action step via GITHUB_ENV, and the auth-token + base-URL
      # pair takes precedence over the oauth input below — the documented
      # precedence, now load-bearing. Every model var is pinned so background
      # small-fast / subagent calls can't leak an anthropic-* id into the
      # gateway (which 400s those loudly by design). Anthropic picks, or no
      # pick, leave this a logged no-op: plan-billed OAuth exactly as before.
      - name: Resolve model routing
        env:
          MODEL: ${{ inputs.model }}
          INJECTOR_URL: ${{ secrets.TODO_INJECTOR_URL }}
          INJECTOR_SECRET: ${{ secrets.TODO_INJECTOR_SECRET }}
        run: |
          # Inverted match: claude-* (and no pick) stay on plan via OAuth;
          # ANYTHING else routes to the gateway, which allowlists hard. Adding
          # or swapping a provider is now a Worker-only change — this YAML never
          # needs another edit for it.
          case "$MODEL" in
            claude-*|"")
              if [ -z "$MODEL" ]; then
                echo "No model input — workflow default applies (plan lane)."
              else
                echo "Anthropic model '$MODEL' — plan lane via OAuth, no rerouting."
              fi
              ;;
            *)
              if [ -z "$INJECTOR_URL" ] || [ -z "$INJECTOR_SECRET" ]; then
                echo "Third-party model '$MODEL' requested but TODO_INJECTOR_URL / TODO_INJECTOR_SECRET are missing — cannot route. Failing loudly instead of billing the wrong lane."
                exit 1
              fi
              {
                echo "ANTHROPIC_BASE_URL=${INJECTOR_URL%/}/anthropic"
                echo "ANTHROPIC_AUTH_TOKEN=$INJECTOR_SECRET"
                echo "ANTHROPIC_MODEL=$MODEL"
                echo "ANTHROPIC_SMALL_FAST_MODEL=$MODEL"
                echo "ANTHROPIC_DEFAULT_OPUS_MODEL=$MODEL"
                echo "ANTHROPIC_DEFAULT_SONNET_MODEL=$MODEL"
                echo "ANTHROPIC_DEFAULT_HAIKU_MODEL=$MODEL"
                echo "CLAUDE_CODE_SUBAGENT_MODEL=$MODEL"
                echo "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1"
                echo "API_TIMEOUT_MS=600000"
                # Usage attribution, no secrets: Claude Code sends this header
                # on every gateway request; the Worker resolves the repo to its
                # registered owner and records the run's tokens against them.
                # correlation_id ties the usage rows to this exact run; the
                # expression is empty on workflows without that input, which
                # the Worker treats as repo-only attribution.
                echo "ANTHROPIC_CUSTOM_HEADERS=X-Void-Attr: repo=${GITHUB_REPOSITORY}; corr=${{ inputs.correlation_id }}"
              } >> "$GITHUB_ENV"
              echo "Model '$MODEL' → third-party gateway (API-billed; plan untouched)."
              ;;
          esac
      - uses: anthropics/claude-code-action@v1
        env:
          # Supabase REST access for reading flagged rows + writing verdicts back.
          # Service role bypasses RLS (trusted backend job, no user session); the
          # routine scopes every query by project_id itself. Add both as repo
          # secrets alongside CLAUDE_CODE_OAUTH_TOKEN.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        with:
          # Subscription auth (Pro/Max) — the SAME plan-billed path as
          # claude-run.yml, NOT anthropic_api_key. This is what puts triage on
          # plan usage rather than API.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet for the fast-path triage sweep (lighter on plan quota than
          # Opus). Root-cause escalation to Opus is a routine-level decision, not
          # a workflow one — see .claude/triage.md. --dangerously-skip-permissions:
          # no human to approve the curl calls the routine makes; safe here — the
          # runner is ephemeral and contents:read means it cannot push to the repo
          # even if it tried.
          #
          # --allowedTools is pinned to exactly what triage needs to read source
          # and talk to PostgREST. This is a CORRECTNESS guard, not just least
          # privilege: with Task available the agent can hand a row to a subagent,
          # narrate that it will "finish writing the verdict once its findings come
          # back", and end its turn — which ends the JOB, because nothing resumes a
          # workflow_dispatch run. The row then sits at 'triaging' until the client
          # reaper flips it to failed. Removing Task makes that failure mode
          # structurally unreachable rather than merely discouraged by the prompt.
          # Do not re-add Task here without also re-reading the "You are the only
          # actor" section of .claude/triage.md.
          claude_args: "--max-turns 80 --model ${{ inputs.model || 'claude-sonnet-5' }} --dangerously-skip-permissions --allowedTools Read,Grep,Glob,Bash"
          # Temporary: surface the agent's full output while verifying the sweep
          # end-to-end (also how the Worker's run_result reads the closing summary).
          show_full_output: true
          prompt: |
            You are running the autonomous-agent TRIAGE sweep for this repository.
            Project id to sweep: ${{ inputs.project_id }}

            Read `.claude/triage.md` from the repository and execute it exactly as
            written, for the project id above. It defines how to read the flagged
            tasks from Supabase, classify each against the real source in this
            checkout, and write the verdict back to Supabase. Complete the whole
            sweep, then exit with the one-paragraph summary the routine specifies.

            You are the only agent in this run and there is no later turn. This
            job ends the moment your turn ends, so every verdict must be PATCHed
            to Supabase BEFORE you write the summary. Never end your turn with a
            row still at 'triaging' and never describe work as continuing in the
            background — if you cannot resolve a task, give it the needs_words
            verdict and move on.
